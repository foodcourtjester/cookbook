<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiments With Food</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <meta name="theme-color" content="#e05638">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Experiments with Food</h1>
    <!-- Category Tags Container -->
    <div class="category-tags" id="tagsContainer">
      <button class="tag active" data-category="all">All</button>
      <button class="tag" data-category="italian">Italian</button>
      <button class="tag" data-category="mexican">Mexican</button>
      <button class="tag" data-category="indian">Indian</button>
      <button class="tag" data-category="vegetarian">Vegetarian</button>
      <button class="tag" data-category="chicken">Chicken</button>
      <button class="tag" data-category="desserts">Desserts</button>
    </div>
  </header>

  <main>
    <!-- Card Grid Container -->
    <div class="recipe-grid" id="recipeGrid"></div>
  </main>

 <!-- Recipe Detail Modal -->
  <div class="modal-overlay" id="recipeModal">
    <div class="modal-content">
      <button class="modal-close" id="closeModal">&times;</button>
      <h2 id="modalTitle">Loading...</h2>
      <img id="modalImage" class="modal-image" src="" alt="">
      
      <!-- New Equipment Section -->
      <h3 class="section-header">Equipment Needed</h3>
      <ul id="modalEquipment" class="ingredient-list"></ul>

      <h3 class="section-header">Ingredients</h3>
      <ul id="modalIngredients" class="ingredient-list"></ul>

      <h3 class="section-header">Instructions</h3>
      <ol id="modalInstructions" class="instruction-list"></ol>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
